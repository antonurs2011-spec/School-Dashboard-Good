name: Reminders
on:
  repository_dispatch:
    types: [remind]        # triggered every 15 minutes by cron-job.org
  schedule:
    - cron: "*/15 * * * *"  # backup, in case GitHub runs it
  workflow_dispatch:        # manual test (Run workflow button)
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node reminders.mjs
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
