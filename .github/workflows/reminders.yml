name: Reminders
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; each reminder is sent once, at or after its time
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node reminders.mjs
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
